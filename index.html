/* Vizuál ve stylu aplikací Czech Jump Rope (Analýza rozhodčích): navy pás nahoře se zelenou linkou,
   modrošedé pozadí, modrý akcent, písmo Figtree. Kroky průvodce jsou očíslovaná stanoviště. */
:root {
  --navy: #315a92; --navy-2: #3c69a5; --on-navy: #ffffff; --on-navy-dim: #c9d5ec;
  --paper: #f2f4f9;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --ink: #111833;
  --muted: #57617e;
  --line: #e1e5ef;
  --line-2: #cdd3e3;
  --accent: #2a5bb5;
  --accent-soft: #e6eefb;
  --green: #12925f;
  --green-soft: #dcf3e9;
  --primary: #315a92;
  --primary-ink: #ffffff;
  --ok: #12925f;
  --crit: #a3202a;
  --display: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #26466f; --navy-2: #30588a; --on-navy: #ffffff; --on-navy-dim: #b3c2e0;
    --paper: #0c1022; --surface: #151a30; --surface-2: #1a2039; --ink: #e8ebf6; --muted: #a3abc6; --line: #262d4a; --line-2: #323a5c;
    --accent: #86aaf0; --accent-soft: #1c2a4a; --green: #4fd39a; --green-soft: #12301f;
    --primary: #86aaf0; --primary-ink: #0c1022; --ok: #4fd39a; --crit: #f4939a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #26466f; --navy-2: #30588a; --on-navy: #ffffff; --on-navy-dim: #b3c2e0;
  --paper: #0c1022; --surface: #151a30; --surface-2: #1a2039; --ink: #e8ebf6; --muted: #a3abc6; --line: #262d4a; --line-2: #323a5c;
  --accent: #86aaf0; --accent-soft: #1c2a4a; --green: #4fd39a; --green-soft: #12301f;
  --primary: #86aaf0; --primary-ink: #0c1022; --ok: #4fd39a; --crit: #f4939a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { overflow-x: clip; background: var(--surface); color: var(--ink); font: 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h1, .h-stranky { font-size: clamp(1.75rem, 5vw, 2.3rem); }
.lista-app h1 { font-size: 1.3rem; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* --- horní lišta */
.lista-app { background: var(--navy); color: var(--on-navy); border-bottom: 3px solid var(--green); position: sticky; top: var(--posun, 0px); z-index: 10; }
.lista-app .in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.znacka { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; min-height: 44px; white-space: nowrap; }
.akce-app { display: flex; gap: 4px; }
.odkaz { background: rgba(255,255,255,.1); border: 0; padding: 8px 14px; min-height: 40px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--on-navy); white-space: nowrap; }
.odkaz:hover { background: rgba(255,255,255,.2); }

/* Šedá plocha končí s obsahem; pod ní je bílá (u průvodce s tlačítky Zpět / Pokračovat). */
main { padding: 24px max(16px, calc((100% - 1048px) / 2)) 32px; background: var(--paper); }
/* Průvodce: šedá plocha má dole stejný vzduch jako u ostatních obrazovek, lišta s tlačítky je až pod ní. */
body[data-pohled="pruvodce"] main { padding-bottom: 0; }
body[data-pohled="pruvodce"] .krok { padding-bottom: 32px; }
@media (max-width: 560px) { body[data-pohled="pruvodce"] .krok { padding-bottom: 24px; } main { padding-bottom: 24px; } }
@media (max-width: 560px) { main { padding-top: 16px; } }

/* --- tlačítka */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--navy); }
.btn.hlavni { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.hlavni:hover { background: var(--navy-2); border-color: var(--navy-2); }
.btn.male { min-height: 40px; padding: 6px 14px; font-weight: 600; }
.btn.nebezpecne { color: var(--crit); }
.btn.potvrd { background: var(--crit); border-color: var(--crit); color: #fff; }

/* --- průvodce: stanoviště */
.stanoviste { list-style: none; margin: 0 auto 24px; padding: 0; max-width: 720px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stanoviste li { position: relative; }
.stanoviste button { width: 100%; background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: .9rem; }
.stanoviste .ctverec { position: relative; z-index: 1; width: 48px; height: 48px; border: 2px dashed var(--line-2); border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: var(--muted); background: var(--paper); }
.stanoviste li:not(:last-child)::after { content: ""; position: absolute; top: 23px; left: calc(50% + 28px); right: calc(-50% + 20px); border-top: 2px dashed var(--line-2); }
.stanoviste .hotovy .ctverec { border: 2px solid var(--green); background: var(--green-soft); color: var(--green); }
.stanoviste .hotovy::after { border-top-style: solid !important; border-top-color: var(--green) !important; }
.stanoviste [aria-current="step"] { color: var(--ink); }
.stanoviste [aria-current="step"] .ctverec { background: var(--navy); border: 2px solid var(--navy); color: var(--on-navy); }
@media (max-width: 560px) {
  .stanoviste .stitek-kroku { display: none; }
  .stanoviste .ctverec { width: 42px; height: 42px; font-size: 1.1rem; }
  .stanoviste li:not(:last-child)::after { top: 20px; left: calc(50% + 25px); right: calc(-50% + 17px); }
}

.krok { max-width: 720px; margin: 0 auto; }
.krok-hlava { display: grid; gap: 6px; margin-bottom: 8px; }
.krok-hlava p { color: var(--muted); font-size: 1.05rem; }
.blok { margin: 24px 0 0; padding: 0; border: 0; min-width: 0; }
.otazka { display: block; font-weight: 700; margin-bottom: 8px; font-size: 1.02rem; padding: 0; }
.napoveda { color: var(--muted); font-size: .92rem; margin-top: 8px; }

/* Dlaždice: všechny možnosti v jednom řádku, každá jen tak široká, jak je potřeba. Vybraná = modrý rámeček a podklad. */
.dlazdice { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); max-width: calc(var(--n, 2) * 190px); }
.dlazdice.s-popisem { max-width: calc(var(--n, 2) * 210px); }
.dlazdice.uzke { grid-template-columns: repeat(auto-fill, minmax(72px, 96px)); max-width: none; }
@media (max-width: 560px) {
  .dlazdice { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); max-width: none; }
  .dlazdice.s-popisem { grid-template-columns: minmax(0, 1fr); }
  .dlazdice.s-popisem label { grid-template-columns: auto 1fr; align-items: center; gap: 0 12px; }
  .dlazdice.s-popisem .nazev { font-size: 1.05rem; min-width: 32px; }
  .dlazdice.uzke { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
}
.dlazdice label { position: relative; display: grid; gap: 4px; align-content: center; min-height: 52px; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.dlazdice label:hover { border-color: var(--navy); }
.dlazdice input { position: absolute; opacity: 0; pointer-events: none; }
.dlazdice .nazev { font-weight: 700; }
.dlazdice .popis { color: var(--muted); font-size: .88rem; line-height: 1.35; }
.dlazdice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.dlazdice label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

.chipy { display: flex; flex-wrap: wrap; gap: 8px; }
.pridat-vd { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; max-width: 560px; }
@media (max-width: 560px) { .pridat-vd { grid-template-columns: minmax(0, 1fr) auto; } .pridat-vd input { grid-column: 1 / -1; } }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 15px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); cursor: pointer; font-weight: 600; }
.chip:hover { border-color: var(--navy); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip[aria-pressed="true"]::before { content: "✓"; font-weight: 800; font-size: .9em; }

.pole-text { display: grid; gap: 6px; }
.pole-text label { font-weight: 700; }
input[type="text"], input[type="date"], input[type="number"], textarea, select {
  min-height: 46px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.dvojice { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .dvojice { grid-template-columns: 2fr 1fr; } }

.krokovac { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); }
.krokovac button { width: 44px; height: 44px; border: 0; background: none; font-size: 1.5rem; cursor: pointer; border-radius: 10px; color: var(--navy); font-weight: 700; }
.krokovac button:hover { background: var(--paper); }
.krokovac output { min-width: 48px; text-align: center; font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }

.cisla { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.cisla label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }

/* Lišta je hned pod otázkami; u dlouhého kroku se drží spodního okraje obrazovky. */
.dolni-lista { position: sticky; bottom: var(--dole, 0px); width: 100vw; margin-left: calc(50% - 50vw); background: var(--surface); z-index: 5; }
.dolni-lista .in { max-width: 752px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dolni-lista .pocet-kroku { color: var(--muted); font-size: .92rem; }
/* Na mobilu lišta s tlačítky nepřekrývá obsah – je až pod ním. */
@media (max-width: 560px) { .dolni-lista { position: static; } }

/* --- checklist */
.souhrn-zavodu { display: grid; gap: 12px; margin-bottom: 16px; }
.souhrn-zavodu > .radek { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.parametry { display: flex; flex-wrap: wrap; gap: 6px; }
.parametry span { padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .85rem; }
.postup-celkem { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.postup-celkem .cislo { font-weight: 800; font-size: 1.9rem; line-height: 1; letter-spacing: -.02em; }
.postup-celkem .radek { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pruh { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.pruh i { display: block; height: 100%; background: var(--green); border-radius: 5px; transition: width .25s ease; }
.ovladani { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.rozlozeni { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.rozlozeni > * { min-width: 0; }
@media (min-width: 920px) { .rozlozeni { grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; } }
.temata { position: sticky; top: calc(var(--posun, 0px) + 63px); z-index: 3; background: var(--paper); padding: 8px 16px; margin: 0 -16px; }
.temata ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.temata a { display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; text-decoration: none; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: .92rem; min-height: 40px; }
.temata a:hover { border-color: var(--navy); }
.temata a[aria-current="true"] { border-color: var(--navy); color: var(--navy); }
.temata a .num { color: var(--muted); font-weight: 500; }
.temata a.splneno .num { color: var(--ok); font-weight: 700; }
@media (min-width: 920px) {
  .temata { top: calc(var(--posun, 0px) + 80px); margin: 0; padding: 0; background: none; }
  .temata ul { flex-direction: column; overflow: visible; }
  .temata a { border-color: transparent; background: none; padding: 6px 12px; min-height: 36px; }
  /* Menu se drží u horního okraje; když je delší než okno, posouvá se samo. */
  .temata { max-height: calc(var(--vh, 100vh) - 96px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .temata a[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--navy); }
  .temata a:hover { background: var(--surface); border-color: var(--line); }
}

.tema { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 4px; margin-bottom: 12px; scroll-margin-top: 130px; }
.tema-hlava { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.tema-hlava .num { color: var(--muted); font-weight: 600; }
.tema.splneno .tema-hlava .num { color: var(--ok); font-weight: 800; }
.tema-hlava { border-bottom: 0; }
.podskupina { list-style: none; font-weight: 700; color: var(--muted); font-size: .92rem; padding: 12px 0 4px; }
.polozky { list-style: none; margin: 0; padding: 0; }
.pol { display: grid; grid-template-columns: 36px 1fr; gap: 0 8px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.pol.se-zapisem { grid-template-columns: 36px 1fr minmax(170px, 260px); }
@media (max-width: 640px) { .pol.se-zapisem { grid-template-columns: 36px 1fr; } .pol.se-zapisem .zapis { grid-column: 2; margin-top: 8px; } }
.pol input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--line-2); border-radius: 7px; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.pol input[type="checkbox"]:hover { border-color: var(--navy); }
.pol input[type="checkbox"]:checked { background: var(--green); border-color: var(--green); }
.pol input[type="checkbox"]:checked::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.pol label { cursor: pointer; padding-top: 2px; display: block; }
.pol .text { font-weight: 600; overflow-wrap: anywhere; }
.pol .kolik { font-weight: 800; color: var(--navy); margin-right: 6px; font-variant-numeric: tabular-nums; }
.pol .info { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.pol .mnozstvi { font-size: .92rem; margin-top: 2px; font-weight: 600; }
.rozpis { font-size: .88rem; color: var(--muted); margin-top: 4px; }
.rozpis summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 2px 0; width: max-content; }
.rozpis ul { margin: 4px 0; padding-left: 18px; }
.rozpis p { margin: 4px 0; }
.pol.hotovo .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.pol.neplati { opacity: .5; }
.pol .zapis input { min-height: 42px; }
.zapis-popisek { display: none; }
.pol .smazat { margin-top: 6px; background: none; border: 0; color: var(--crit); cursor: pointer; padding: 4px 0; font-size: .88rem; text-decoration: underline; }
.skryte { color: var(--muted); font-size: .9rem; padding: 4px 0; border-top: 1px solid var(--line); }
.skryte button { background: none; border: 0; padding: 6px 2px; min-height: 44px; color: var(--ink); text-decoration: underline; cursor: pointer; font-weight: 600; }
.stitek { display: inline-block; font-size: .78rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.vlastni-form { display: grid; gap: 10px; grid-template-columns: 1fr; margin-top: 10px; }
@media (min-width: 620px) { .vlastni-form { grid-template-columns: 2fr 1fr auto; align-items: end; } }
.vlastni-form label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
details.pridat { background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px 16px; }
details.pridat summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.hotovo-banner { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); border-radius: var(--r); padding: 12px 16px; font-weight: 700; margin-bottom: 16px; }

/* --- uložit */
.ulozit { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.vyber-soubor { position: relative; width: max-content; }
.vyber-soubor input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.vyber-soubor:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
.karta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.karta .btn-rada { display: flex; flex-wrap: wrap; gap: 8px; }
.zprava { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); border-left: 4px solid var(--accent); }
.zprava.chyba { border-left-color: var(--crit); }
textarea { min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }

.tiskova-hlava { display: none; }
@media print {
  @page { margin: 14mm 12mm; }
  body { background: #fff; color: #000; font-size: 10.5pt; }
  .lista-app, .temata, .ovladani, .dolni-lista, details.pridat, .skryte, .postup-celkem, .souhrn-zavodu, .no-print, .hotovo-banner, .zprava { display: none !important; }
  main { padding: 0; max-width: none; }
  .tiskova-hlava { display: block; margin-bottom: 6mm; }
  .rozlozeni { display: block; }
  .tema { border: 0; padding: 0; margin: 0 0 6mm; break-inside: auto; }
  .tema-hlava { border-bottom: 1.5pt solid #000; break-after: avoid; }
  .pol { break-inside: avoid; border-top: .5pt solid #aaa; padding: 1.6mm 0; grid-template-columns: 8mm 1fr; }
  .pol.se-zapisem { grid-template-columns: 8mm 1fr 55mm; }
  .pol.se-zapisem .zapis { grid-column: auto; margin: 0; }
  .pol input[type="checkbox"] { width: 4.2mm; height: 4.2mm; border: 1pt solid #000; border-radius: 1px; }
  .pol input[type="checkbox"]:checked { background: #000; }
  /* Pole na jména: popisek nad rámečkem, do kterého se píše – ne samotná čára, která splývá s oddělovači řádků. */
  .zapis-popisek { display: block; font-size: 7.5pt; color: #555; margin-bottom: .6mm; }
  .pol .zapis input { border: .5pt solid #888; border-radius: 1.5mm; min-height: 0; height: 7.5mm; padding: 0 2mm; font-size: 9pt; background: none; box-shadow: none; }
  .pol .zapis input::placeholder { color: transparent; }
  .pol.neplati { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

/* ============================================================ podmínky */
function parse(s) {
  const toks = (s || "").match(/!=|=|!|\(|\)|\[|\]|,|[A-Za-z0-9_.]+/g) || [];
  if (!toks.length) return { t: "vzdy" };
  let i = 0;
  const peek = () => toks[i];
  const take = (e) => { const t = toks[i]; if (t === undefined || (e && t !== e)) throw new Error("podmínka: " + s); i++; return t; };
  const nebo = () => { let n = a(); while (peek() === "or") { take(); n = { t: "or", l: n, r: a() }; } return n; };
  const a = () => { let n = ne(); while (peek() === "and") { take(); n = { t: "and", l: n, r: ne() }; } return n; };
  const ne = () => {
    if (peek() === "!") { take(); return { t: "not", x: ne() }; }
    if (peek() === "(") { take(); const n = nebo(); take(")"); return n; }
    const id = take();
    if (peek() === "=" || peek() === "!=") { const op = take(); return { t: "cmp", id, op, v: take() }; }
    if (peek() === "in") { take(); take("["); const v = [take()]; while (peek() === ",") { take(); v.push(take()); } take("]"); return { t: "in", id, v }; }
    return { t: "bool", id };
  };
  const n = nebo();
  if (i !== toks.length) throw new Error("podmínka: " + s);
  return n;
}
const CACHE = new Map();
function plati(kdy, cfg) {
  if (!kdy) return true;
  let ast = CACHE.get(kdy);
  if (!ast) { try { ast = parse(kdy); } catch (e) { console.warn(e); ast = { t: "vzdy" }; } CACHE.set(kdy, ast); }
  const ev = (n) => {
    switch (n.t) {
      case "vzdy": return true;
      case "or": return ev(n.l) || ev(n.r);
      case "and": return ev(n.l) && ev(n.r);
      case "not": return !ev(n.x);
      case "bool": return !!cfg[n.id];
      case "cmp": return (String(cfg[n.id]) === n.v) === (n.op === "=");
      case "in": return n.v.includes(String(cfg[n.id]));
    }
    return true;
  };
  return ev(ast);
}

let cekaNaPotvrzeni = null;

function zaznamenejNavstevu() { const z = Z(); z.ui.navstiveno = Math.max(z.ui.navstiveno || 0, krok + 1); }
/* Zvýraznění tématu, ve kterém právě jsem, a jeho posun do viditelné části menu.
   Aktivní je poslední téma, jehož začátek už přejel pod lištu a menu nahoře;
   na konci stránky poslední téma. Počítá se při každém posunu stránky. */
let pozorovatel = null, aktivniTema = null;
function sledujTemata() {
  if (pozorovatel) window.removeEventListener("scroll", pozorovatel);
  aktivniTema = null;
  let ceka = false;
  const prepocti = () => {
    ceka = false;
    const sekce = [...document.querySelectorAll("section.tema")];
    if (!sekce.length) return;
    const nav = document.querySelector(".temata");
    const ul = nav && nav.querySelector("ul");
    const nahore = ul && getComputedStyle(ul).flexDirection !== "column";
    /* kotvy mají scroll-margin-top 130 px – téma po kliknutí v menu musí vyjít jako aktivní */
    const hranice = Math.max(140, nahore ? nav.getBoundingClientRect().bottom + 24 : 0);
    /* V rámu na cizím webu se posouvá stránka kolem rámu – její posun a výšku okna hlásí vkládací kód. */
    const css = getComputedStyle(document.documentElement);

    let akt = sekce[0];
    for (const s of sekce) if (s.getBoundingClientRect().top - posun <= hranice) akt = s;
    if (posun + okno + window.scrollY >= document.documentElement.scrollHeight - 4 && (window.scrollY > 0 || posun > 0)) akt = sekce[sekce.length - 1];
    if (akt.id === aktivniTema) return;

/* ============================================================ výška pro iframe */
let posledniVyska = 0;
/* V rámu (iframe) na cizím webu: výška = výška obsahu, ne okna rámu – jinak by rám nikdy nezmenšil
   a pod obsahem by zůstalo prázdné místo. */
function posliVysku() {
  if (window.parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (Math.abs(h - posledniVyska) < 2) return;

/* Rám se sám neposouvá – posouvá se stránka kolem něj. Když nám ji stránka hlásí (vkládací kód z README),

window.addEventListener("message", (e) => {
